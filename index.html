<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliothèque ISTEAH – Catalogue</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#catalogue">Aller au catalogue</a>

  <header>
    <h1>Bibliothèque ISTEAH</h1>
    <nav aria-label="Navigation principale">
      <a href="#catalogue">Catalogue</a>
      <a href="#ajout">Ajouter un livre</a>
    </nav>
  </header>

  <main>
    <section id="catalogue" aria-labelledby="titre-catalogue">
      <h2 id="titre-catalogue">Catalogue</h2>

      <div class="controles">
        <div class="champ">
          <label for="recherche">Titre ou auteur</label>
          <input type="search" id="recherche" autocomplete="off">
        </div>
        <div class="champ">
          <label for="filtre-categorie">Catégorie</label>
          <select id="filtre-categorie"><option value="">Toutes</option></select>
        </div>
        <div class="champ">
          <label for="tri">Trier par</label>
          <select id="tri">
            <option value="titre-asc">Titre (A → Z)</option>
            <option value="titre-desc">Titre (Z → A)</option>
            <option value="annee-asc">Année (croissante)</option>
            <option value="annee-desc">Année (décroissante)</option>
          </select>
        </div>
        <div class="champ case">
          <input type="checkbox" id="dispo-seulement">
          <label for="dispo-seulement">Disponibles seulement</label>
        </div>
        <button type="button" id="reinitialiser" class="secondaire">Réinitialiser</button>
      </div>

      <p id="compteur" role="status" aria-live="polite"></p>
      <div id="grille" class="grille"></div>
      <p id="vide" hidden>Aucun livre ne correspond à ces critères. Modifiez la recherche ou les filtres.</p>
    </section>

    <section id="ajout" aria-labelledby="titre-ajout">
      <h2 id="titre-ajout">Ajouter un livre</h2>
      <form id="form-ajout" novalidate>
        <div class="champ">
          <label for="titre">Titre</label>
          <input type="text" id="titre" aria-describedby="erreur-titre">
          <p class="erreur" id="erreur-titre" aria-live="polite"></p>
        </div>
        <div class="champ">
          <label for="auteur">Auteur</label>
          <input type="text" id="auteur" aria-describedby="erreur-auteur">
          <p class="erreur" id="erreur-auteur" aria-live="polite"></p>
        </div>
        <div class="champ">
          <label for="annee">Année de publication</label>
          <input type="number" id="annee" min="1450" aria-describedby="erreur-annee">
          <p class="erreur" id="erreur-annee" aria-live="polite"></p>
        </div>
        <div class="champ">
          <label for="categorie">Catégorie</label>
          <select id="categorie" aria-describedby="erreur-categorie">
            <option value="">Choisir…</option>
          </select>
          <p class="erreur" id="erreur-categorie" aria-live="polite"></p>
        </div>
        <button type="submit">Ajouter le livre</button>
      </form>
    </section>
  </main>

  <footer>
    <p>LOG3550 Développement web · Devoir 1 · ISTEAH</p>
  </footer>

  <template id="modele-carte">
    <article class="carte">
      <span class="etiquette"></span>
      <h3 class="carte-titre"></h3>
      <p class="carte-auteur"></p>
      <p class="carte-meta"></p>
      <div class="carte-actions">
        <button type="button" class="btn-statut secondaire"></button>
        <button type="button" class="btn-supprimer danger">Supprimer</button>
      </div>
    </article>
  </template>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
